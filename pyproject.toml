[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyrenth-agents"
version = "0.2.1"
description = "Agents that read the web through Lyrenth and finish the job: one command, cited answers, and steps that can write the result to a file."
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Lyrenth" }]
keywords = ["agents", "recipes", "citations", "llm", "web", "lyrenth", "aidocument", "prompt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = ["lyrenth>=0.1.1"]
readme = "README.md"

[project.scripts]
lyrenth-agents = "lyrenth_agents.cli:main"

[project.urls]
Homepage = "https://lyrenth.com"
Documentation = "https://lyrenth.com/docs/quickstart"

[tool.hatch.build.targets.wheel]
packages = ["src/lyrenth_agents"]
